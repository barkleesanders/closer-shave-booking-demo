name = "closer-shave-booking-demo"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Native observability (Cloudflare-first, no external/paid products):
# Workers Logs + Workers Traces, persisted at full head sampling.
# Errors also feed Cloudflare Issues -> the cf-issues auto-fix loop.
# Guarded by `npm run lint:observability`.
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
head_sampling_rate = 1

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# Reminders: every 30 minutes the scheduled() handler sends booking
# confirmations not yet sent and 24h SMS/email reminders via the Resend seam.
# Email is DEMO MODE until the RESEND_API_KEY secret is set.
[triggers]
crons = ["*/30 * * * *"]

# D1 database for services, shop hours, and bookings.
# Created on deploy with: wrangler d1 create closer-shave-booking
# Then replace database_id below with the ID from the output.
[[d1_databases]]
binding = "DB"
database_name = "closer-shave-booking"
database_id = "df548d2e-32f8-43c6-9330-ce913c712caa"

# Secrets (set via `wrangler secret put`, never committed):
#   ADMIN_KEY      — shared secret protecting /admin (demo-grade)
#   RESEND_API_KEY — Resend key enabling live confirmation/reminder email
# Vars:
#   EMAIL_FROM     — sender address once Resend is live, e.g. "The Closer Shave <bookings@example.com>"
[vars]
EMAIL_FROM = "The Closer Shave (demo) <demo@localhost>"
